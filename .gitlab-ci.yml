workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH'

stages: [verify, acceptance]

windows-x64:
  stage: verify
  tags: [win203-unprotected]
  resource_group: windows-native-gui
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - 'python dev/ci/evidence.py'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/ci-evidence/$CI_JOB_NAME/
      - build/JellyfinDesktop-*.exe
      - build/JellyfinDesktop-*.zip
    reports:
      junit: build/ci-evidence/$CI_JOB_NAME/headless-ctest.xml

windows-system:
  extends: windows-x64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system
  artifacts:
    when: always
    expire_in: 14 days
    paths: [build/ci-evidence/$CI_JOB_NAME/]
    reports:
      junit: build/ci-evidence/$CI_JOB_NAME/headless-ctest.xml

.unix-native:
  stage: verify
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - python3 dev/ci/evidence.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [build/ci-evidence/$CI_JOB_NAME/]
    reports:
      junit: build/ci-evidence/$CI_JOB_NAME/headless-ctest.xml

linux-static:
  extends: .unix-native
  tags: [ubuntu24-unprotected]
  resource_group: linux-native-gui
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: static

linux-system:
  extends: linux-static
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system

macos-static:
  extends: .unix-native
  tags: [macos-tahoe-intel-unprotected]
  resource_group: macos-native-gui
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: static
    CI_ALLOWED_GUI_ACCOUNT: runner
    CI_ALLOWED_GUI_HOST: tahoe-runner-114

macos-system:
  extends: macos-static
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system

product-acceptance:
  stage: acceptance
  when: always
  tags: [win203-unprotected]
  needs:
    - job: windows-x64
      artifacts: true
    - job: windows-system
      artifacts: true
    - job: linux-static
      artifacts: true
    - job: linux-system
      artifacts: true
    - job: macos-static
      artifacts: true
    - job: macos-system
      artifacts: true
  script:
    - python dev/ci/acceptance.py
