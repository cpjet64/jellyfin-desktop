workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH'

stages: [verify]

windows-x64:
  stage: verify
  tags: [win203-unprotected]
  resource_group: windows-native-gui
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - '& ./dev/windows/ci.ps1'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/ci-results/
      - build/JellyfinDesktop-*.exe
      - build/JellyfinDesktop-*.zip
    reports:
      junit: build/ci-results/ctest.xml

windows-system:
  extends: windows-x64
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system
  artifacts:
    when: always
    expire_in: 14 days
    paths: [build/ci-results/]
    reports:
      junit: build/ci-results/ctest.xml

.unix-native:
  stage: verify
  timeout: 2h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - python3 dev/ci/native.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [build/ci-results/]
    reports:
      junit: build/ci-results/ctest.xml

linux-static:
  extends: .unix-native
  tags: [ubuntu24-unprotected]
  resource_group: linux-native-gui
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: static

linux-system:
  extends: linux-static
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system

macos-static:
  extends: .unix-native
  tags: [macos-tahoe-intel-unprotected]
  resource_group: macos-native-gui
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: static

macos-system:
  extends: macos-static
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    CI_MPVQT_MODE: system
