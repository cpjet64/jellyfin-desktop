name: Mirror GitLab releases
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/mirror-gitlab-releases.yml
      - scripts/release_mirror.py
permissions:
  contents: write
concurrency:
  group: mirror-gitlab-releases
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'cpjet64/jellyfin-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Mirror published releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_mirror.py
